name: Deploy

on:
  push:
    branches: [ main, develop ]
    # ⚠️ 本文件 paths 与 ci.yml 各自维护（GitHub Actions 不支持跨文件复用路径清单）。
    # 仅代码/内容/配置相关改动触发部署；纯文档改动不触发，节省 Pages 构建。
    # 改 paths 时请同步核对 ci.yml。
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'tools/**'
      - 'scaffolds/**'
      - 'themes/**'
      - '_config*.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'CNAME'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支的连续部署取消旧运行，避免排队；部署不可中断，故 cancel 保留最近一次
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize theme submodules
        run: |
          git submodule update --init --recursive
          pnpm run themes:status

      - name: Validate Almagest theme configuration
        run: pnpm run almagest:validate

      - name: Run tests
        run: pnpm test

      - name: Build static files with Almagest theme
        run: |
          pnpm run clean
          pnpm run almagest:validate
          pnpm run build

      - name: Verify build output
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "::error::Build failed: public/index.html not found"
            exit 1
          fi
          echo "Build verification passed"
          echo "Generated HTML files: $(find public -name '*.html' | wc -l)"
          echo "Total size: $(du -sh public | cut -f1)"

      - name: Deploy to GitHub Pages (staging)
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages-staging
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: staging - ${{ github.event.head_commit.message }}'

      - name: Deploy to GitHub Pages (production)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: production - ${{ github.event.head_commit.message }}'
