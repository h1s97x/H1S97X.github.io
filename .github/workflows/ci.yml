name: CI

on:
  push:
    branches: [ main, develop ]
    # ⚠️ 本文件 paths 与 deploy.yml 各自维护（GitHub Actions 不支持跨文件复用路径清单）。
    # 仅代码/内容/配置相关改动触发；纯文档/说明改动不跑 CI。
    # 改 paths 时请同步核对 deploy.yml。
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'tools/**'
      - 'scaffolds/**'
      - 'themes/**'
      - '_config*.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    # 与 push 相同的路径过滤，减少 PR 噪音
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'tools/**'
      - 'scaffolds/**'
      - 'themes/**'
      - '_config*.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# 并发控制：同一 ref 的连续 push 自动取消旧运行，不排队，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Initialize Almagest theme submodules
      run: |
        git submodule update --init --recursive
        pnpm run themes:status

    - name: Validate Almagest theme configuration
      run: pnpm run almagest:validate

    - name: Run tests
      run: pnpm test

    - name: Lint check
      run: pnpm run lint

    - name: Build test with Almagest theme
      run: |
        pnpm run clean
        pnpm run almagest:validate
        pnpm run build

    - name: Check for broken links
      run: pnpm run check-links || echo "::warning::Link check reported issues (non-blocking)"

  # 安全审计：仅 main 分支执行（低频、成本可控），避免每个 PR 重复跑
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run security audit (fail on high/critical)
      run: |
        pnpm config set registry https://registry.npmjs.org
        pnpm exec audit-ci --high
