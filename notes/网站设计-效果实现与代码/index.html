lass="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br></pre></td><td class="code"><pre><span class="line">root 是颜色变量</span><br><span class="line">:root &#123;</span><br><span class="line">    --theme-accent-color: rgb(142, 212, 149);</span><br><span class="line">    --theme-accent-color--rgb: 142, 212, 149;</span><br><span class="line">    --theme-secondary-color: rgb(24, 127, 245);</span><br><span class="line">    --theme-secondary-color--rgb: 24, 127, 245;</span><br><span class="line">    --theme-text-color: rgb(44, 62, 80);</span><br><span class="line">    --theme-text-color--rgb: 44, 62, 80;</span><br><span class="line">    --theme-success-color: rgb(35, 165, 94);</span><br><span class="line">    --theme-info-color: rgb(122, 157, 255);</span><br><span class="line">    --theme-warn-color: rgb(255, 180, 4);</span><br><span class="line">    --theme-danger-color: rgb(255, 114, 114);</span><br><span class="line">    --theme-empty-color: rgb(185, 185, 185);</span><br><span class="line">    --theme-link-color: rgb(63, 81, 181);</span><br><span class="line">    --theme-accent-link-color: rgb(255, 255, 255);</span><br><span class="line">    --theme-background-color: rgb(248, 248, 248);</span><br><span class="line">    --theme-border-color: rgb(218, 218, 218);</span><br><span class="line">    --theme-button-color: rgb(37, 180, 73);</span><br><span class="line">    --theme-button-color--hover: #2bd155;</span><br><span class="line">    --theme-button-color--active: #219e40;</span><br><span class="line">    --theme-card-background-color: rgba(255, 255, 255);</span><br><span class="line">    --theme-card-background-color--rgb: 255, 255, 255;</span><br><span class="line">    --theme-card-box-shadow: 0 0 .5rem rgba(0, 0, 0, .1);</span><br><span class="line">    --theme-card-box-shadow--hover: 0 0 .85rem rgba(0, 0, 0, .2);</span><br><span class="line">    --theme-card-border-color: rgb(230, 230, 238);</span><br><span class="line">    --theme-header-background-color: rgb(255, 255, 255);</span><br><span class="line">    --theme-header-box-shadow-color: rgb(238, 239, 241);</span><br><span class="line">    --theme-footer-top-color: rgb(251, 251, 252);</span><br><span class="line">    --theme-footer-bottom-color: #e7e7ed;</span><br><span class="line">    --theme-input-background-color: rgb(245, 245, 245);</span><br><span class="line">    --theme-input-border-color: rgb(222, 222, 222);</span><br><span class="line">    --theme-input-border-color--hover: #e1e1e1</span><br><span class="line">&#125;</span><br><span class="line">h2:before &#123;</span><br><span class="line">    width: .25em;</span><br><span class="line">    height: 70%;</span><br><span class="line">    background-color: rgb(142, 212, 149);</span><br><span class="line">&#125;</span><br><span class="line">h3:before &#123;</span><br><span class="line">    width: .2em;</span><br><span class="line">    height: 60%;</span><br><span class="line">    background-color: rgba(var(--theme-accent-color--rgb),.85);</span><br><span class="line">&#125;</span><br><span class="line">h1:before,h2:before,h3:before,h4:before,h5:before,h6:before &#123;</span><br><span class="line">    content: &quot;&quot;;</span><br><span class="line">    display: block;</span><br><span class="line">    position: absolute;</span><br><span class="line">    top: 50%;</span><br><span class="line">    left: 0;</span><br><span class="line">    transform: translateY(-50%);</span><br><span class="line">    border-radius: 1em;</span><br><span class="line">&#125;</span><br><span class="line">h2,h3&#123;</span><br><span class="line">    font-weight: 700;</span><br><span class="line">    padding: .2rem;</span><br><span class="line">    color: var(--theme-text-color);</span><br><span class="line">    position: relative;/* 重要元素 */</span><br><span class="line">&#125;</span><br><span class="line">h2 &#123;</span><br><span class="line">    border: 0;</span><br><span class="line">    font: inherit;</span><br><span class="line">    font-size: 1.6em;</span><br><span class="line">    margin: 1rem 0;</span><br><span class="line">    padding-left: 1rem;</span><br><span class="line">    vertical-align: baseline;</span><br><span class="line">&#125;</span><br><span class="line">h3 &#123;</span><br><span class="line">    font-size: 1.3rem;</span><br><span class="line">    margin: .5em 0;</span><br><span class="line">    padding-left: .8rem;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line">&lt;h2&gt;标题&lt;/h2&gt;</span><br></pre></td></tr></table></figure> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line">一：文字前面用一个标签，将标签设置成小方块</span><br><span class="line">二、使用边框属性</span><br><span class="line">三、使用伪元素:before</span><br><span class="line">四、border-left: 2px solid red;</span><br></pre></td></tr></table></figure> <p><a target="_blank" rel="noopener" href="https://www.zhihu.com/question/395120933">CSS如何在文字面前设置一个小方块？</a></p> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br></pre></td><td class="code"><pre><span class="line">&lt;style type=&quot;text/css&quot;&gt;</span><br><span class="line">  .heimu &#123;</span><br><span class="line">    transition: color 0.13s linear;</span><br><span class="line">    color: #252525;</span><br><span class="line">    text-shadow: none;</span><br><span class="line">    background-color: #252525;</span><br><span class="line">  &#125;</span><br><span class="line">  span.heimu:hover, span.heimu:active &#123;</span><br><span class="line">    color: white;</span><br><span class="line">&#125;</span><br><span class="line">&lt;/style&gt;</span><br><span class="line"></span><br><span class="line">&lt;span title=&quot;你知道的太多了&quot; class=&quot;heimu&quot;&gt;黑幕&lt;/span&gt;</span><br></pre></td></tr></table></figure> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">https://zditect.com/article/21283930.html#:~:text=%E2%80%9C%E6%AD%A3%E7%A1%AE%E2%80%9D%E7%9A%84%E9%93%BE%E6%8E%A5%E6%A0%BC%E5%BC%8F%E6%98%AF%20file%3A%2F%2F%2F%20%E5%90%8E%E8%B7%9F%E6%96%87%E4%BB%B6%E7%9A%84%E8%B7%AF%E5%BE%84%EF%BC%8C%E5%9C%A8%E6%95%B4%E4%B8%AA%E8%BF%87%E7%A8%8B%E4%B8%AD%E4%BD%BF%E7%94%A8%E6%AD%A3%E6%96%9C%E6%9D%A0%EF%BC%9A,%5B%20%5Bfile%3A%2F%2F%2Fhome%2Fuser%2Fsomefile%5D%5D%20%E3%80%82</span><br><span class="line"></span><br></pre></td></tr></table></figure> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line">加前缀 file:///</span><br><span class="line">空格用 %20</span><br><span class="line">斜杠用正斜杠/ 别用反斜杠\</span><br><span class="line">例如： file:///E:/Thunder%20download/Thunder%20download</span><br></pre></td></tr></table></figure> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">https://www.cnblogs.com/tqtsanshi/p/16631636.html</span><br><span class="line">使用云链转换：https://easylink.cc/</span><br></pre></td></tr></table></figure> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br></pre></td><td class="code"><pre><span class="line">同页面</span><br><span class="line">示例：</span><br><span class="line">首先，使用 id 属性创建书签：</span><br><span class="line">&lt;h2 id=&quot;C4&quot;&gt;第 4 章&lt;/h2&gt;</span><br><span class="line"></span><br><span class="line">然后，在同一页中添加指向书签的链接跳到 (&quot;Chapter 4&quot;):</span><br><span class="line">&lt;a href=&quot;#C4&quot;&gt;跳转到第 4 章&lt;/a&gt;</span><br><span class="line"></span><br><span class="line">不同页面：</span><br><span class="line">&lt;a href=&quot;html_demo.html#C4&quot;&gt;跳转到第 4 章&lt;/a&gt;</span><br></pre></td></tr></table></figure> <p>More info: <a target="_blank" rel="noopener" href="https://www.w3schools.cn/html/html_links_bookmarks.asp">页面书签</a></p> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line"></span><br></pre></td></tr></table></figure> <p>More info: <a target="_blank" rel="noopener" href="https://www.zhihu.com/question/432499743">HTML+CSS制作如图所示的网页导航栏</a></p> <figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br></pre></td><td class="code"><pre><span class="line">什么是图片懒加载</span><br><span class="line">当访问一个页面的时候，先把img元素或是其他元素的背景图片路径替换成一张大小为1*1px图片的路径（这样就只需请求一次），当图片出现在浏览器的可视区域内时，才设置图片真正的路径，让图片显示出来。这就是图片懒加载。</span><br><span class="line"></span><br><span class="line">通俗一点：</span><br><span class="line">1、就是创建一个自定义属性data-src存放真正需要显示的图片路径，而img自带的src放一张大小为1 * 1px的图片路径。</span><br><span class="line">2、当页面滚动直至此图片出现在可视区域时，用js取到该图片的data-src的值赋给src。</span><br><span class="line">ps：自定义属性可以取任何名字</span><br><span class="line"></span><br><span class="line">需要了解的问题</span><br><span class="line">1、如何加载图片？</span><br><span class="line">2、如何判断一个元素出现在视野中？</span><br><span class="line"></span><br><span class="line">solution1: 如何加载图片</span><br><span class="line">**只需要把data-src中的地址放到src的里面就好了**</span><br><span class="line">code:</span><br><span class="line"></span><br><span class="line">function loadImg($img)&#123;</span><br><span class="line">//.attr(值)</span><br><span class="line">//.attr(属性名称,值)</span><br><span class="line">$img.attr(&#x27;src&#x27;, $img.attr(&#x27;data-src&#x27;)) //把data-src的值 赋值给src</span><br><span class="line">$img.attr(&#x27;data-isLoaded&#x27;, 1) //已加载过的图片做标记</span><br><span class="line">&#125;</span><br><span class="line">solution2:如何判断一个元素出现在视野中？</span><br><span class="line">**元素相对顶点的距离(文字) &lt;= 窗口高度 + 滚动的距离**</span><br><span class="line">代码：</span><br><span class="line"></span><br><span class="line">function isShow($node)&#123;</span><br><span class="line">return $node.offset().top &lt;= $(window).height() + $(window).scrollTop()</span><br><span class="line">&#125;</span><br><span class="line"></span><br></pre></td></tr></table></figure> <img src="https://easylink.cc/iso5pz" data-src="https://easylink.cc/iso5pz" loading="lazy"> <p><a target="_blank" rel="noopener" href="https://www.cnblogs.com/moxiaowohuwei/p/7908877.html">参考文章</a></p> <fig
